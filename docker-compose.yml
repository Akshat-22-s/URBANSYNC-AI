version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: urbansync-postgis
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urbansync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-urbansync_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-urbansync} -d ${POSTGRES_DB:-urbansync_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - urbansync-net

  redis:
    image: redis:7.2-alpine
    container_name: urbansync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - urbansync-net

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: urbansync-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
    volumes:
      - ./services:/app/services
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - urbansync-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: urbansync-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://gateway:8000/ws
      - PORT=3000
    depends_on:
      - gateway
    networks:
      - urbansync-net

volumes:
  pgdata:
    name: urbansync-pgdata

networks:
  urbansync-net:
    name: urbansync-net
    driver: bridge
